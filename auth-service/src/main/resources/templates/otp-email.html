<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f6f8fa; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 20px auto; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .header { background-color: #232f3e; color: white; text-align: center; padding: 20px; font-size: 22px; font-weight: bold; }
        .code { font-size: 36px; font-weight: bold; color: #232f3e; text-align: center; margin: 30px 0; }
        .expire { text-align: center; color: gray; font-size: 14px; }
        .footer { background-color: #f6f8fa; padding: 20px; font-size: 13px; color: #555; text-align: center; }
        .warning { background: #f9f9f9; padding: 15px; border-top: 1px solid #ddd; font-size: 14px; color: #333; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">Spotube</div>
    <div class="code">[[OTP_CODE]]</div>
    <div class="expire">(This code will expire in 5 minutes)</div>
    <div class="warning">
        We will never ask you to share your password or payment details.<br>
        If you did not request this code, please ignore this email.
    </div>
    <div class="footer">
        &copy; 2025 Spotube Inc. All rights reserved.
    </div>
</div>
</body>
</html>
