spring:
  datasource:
    url: jdbc:h2:mem:history;DB_CLOSE_DELAY=-1    # DB chạy trong RAM, mỗi lần restart reset
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: history-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer


  jpa:
    hibernate:
      ddl-auto: update   # tạo/sync bảng tự động (update, create, create-drop, validate)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8082 # port riêng cho auth-service


