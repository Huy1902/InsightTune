spring:
  datasource:
    url: jdbc:h2:mem:user;DB_CLOSE_DELAY=-1      # DB chạy trong RAM, mỗi lần restart reset
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true


  jpa:
    hibernate:
      ddl-auto: update   # tạo/sync bảng tự động (update, create, create-drop, validate)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8081   # port riêng cho auth-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

